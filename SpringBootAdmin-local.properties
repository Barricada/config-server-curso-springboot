spring.application.name=SpringBootAdmin
server.port=8062

custom.activeprofileName=local

# servidor de Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.db.show-details=always
management.health.defaults.enabled=true
management.health.defaults.show-details=always
management.health.defaults.status.order=DOWN, OUT_OF_SERVICE, UP, UNKNOWN